    options: { maxZoom: 19, subdomains: 'abcd',
      attribution: '© OpenStreetMap · © CARTO' } },
  { name: 'OpenStreetMap',
    url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    options: { maxZoom: 19, attribution: '© OpenStreetMap' } },
  { name: 'Esri World Street',
    url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
    options: { maxZoom: 19, attribution: 'Tiles © Esri' } },
];

function addTileLayerWithFallback(map, idx = 0) {
  if (idx >= TILE_PROVIDERS.length) {
    setProgress('No se pueden cargar baldosas. Probablemente tu red bloquea los servidores de mapas.');
    return;
  }
  const p = TILE_PROVIDERS[idx];
  const layer = L.tileLayer(p.url, Object.assign({ crossOrigin: true }, p.options));
  let errors = 0;
  let succeeded = false;
  const t = setTimeout(() => {
    if (!succeeded) {
      try { map.removeLayer(layer); } catch(e){}
      addTileLayerWithFallback(map, idx + 1);
    }
  }, 6000);
  layer.on('load', () => { succeeded = true; clearTimeout(t); setProgress(`Mapa cargado vía ${p.name}`); });
  layer.on('tileerror', () => {
    errors++;
    if (errors >= 4 && !succeeded) {
      succeeded = true; // prevent timeout from re-triggering
      clearTimeout(t);
      try { map.removeLayer(layer); } catch(e){}
      addTileLayerWithFallback(map, idx + 1);
    }
  });
  layer.addTo(map);
}

function initMap() {
  const mapEl = document.getElementById('map');
  if (!mapEl) return; // map view not visible
  // If a previous Leaflet instance was bound to this DOM node but the node was replaced,
  // rebuild the instance to avoid the "Map container is already initialized" error.
  if (mapInstance && mapInstance._container !== mapEl) {
    try { mapInstance.remove(); } catch (e) {}
    mapInstance = null;
    mapLayerGroup = null;
  }
  if (!mapInstance) {
    mapInstance = L.map(mapEl, { preferCanvas: true }).setView([41.39, 2.165], 12); // Barcelona
    addTileLayerWithFallback(mapInstance);
  }
  // Force Leaflet to recompute size (critical after reattaching the container)
  setTimeout(() => mapInstance.invalidateSize(true), 50);
  setTimeout(() => mapInstance.invalidateSize(true), 300);
  if (mapLayerGroup) mapLayerGroup.clearLayers();
  mapLayerGroup = L.layerGroup().addTo(mapInstance);
  const bounds = [];
  for (const g of state.filtered) {
    for (const sede of g.sedes) {
      if (sede.lat && sede.lng) {
        const color = pinColor(sede);
        const m = L.circleMarker([sede.lat, sede.lng], {
          radius: 7, color, fillColor: color, fillOpacity: 0.85, weight: 2
        });
        const needs = (sede.alerta || '').includes('TOCA');
        m.bindPopup(`
          <b>${escapeHtml(g.nombre_padre || sede.nombre)}</b><br>
          ${sede.label_sede ? `<span style="color:#888">${escapeHtml(sede.label_sede)}</span><br>` : ''}
          ${escapeHtml(sede.direccion)}<br>
          ${needs ? '<span style="color:#a52821">⚠ Toca visita</span><br>' : ''}
          <a href="#" data-empresa="${escapeAttr(g.id_empresa)}" class="popup-open">Abrir ficha →</a>
        `);
        m.addTo(mapLayerGroup);
        bounds.push([sede.lat, sede.lng]);
      }
    }
  }
  if (bounds.length) {
    mapInstance.fitBounds(bounds, { padding: [30, 30], maxZoom: 14 });
  }
  mapInstance.on('popupopen', (e) => {
    const a = e.popup._contentNode.querySelector('.popup-open');
    if (a) a.onclick = (ev) => { ev.preventDefault(); openDetail(a.dataset.empresa); };
  });
  updateMapOverlay();
}

/* ---------- Geocoding (Nominatim, cached + negative cache + fallbacks) ---------- */

// Strip floor/door/local info that confuses Nominatim
function cleanAddress(addr) {
  if (!addr) return '';
  let s = addr;
  // remove tokens like "ENTLO 1", "ATICO 4", "PRAL 2", "PISO 3", "LOCAL 5", "BAJOS", "DESPACHO 95",
  // "PLANTA 3", "PUERTA 2", "ESC B", "BIS", "TIENDA 1", "DCHO 106"
  s = s.replace(/,?\s*\b(ENTLO|ENTRESUELO|ATICO|ATIC|SOBREATICO|PRINCIPAL|PRAL|PISO|PLANTA|LOCAL|LLOCAL|BAJOS|BAJO|BAIXOS|TIENDA|DESPACHO|DCHO|DCHA|DRETA|IZQ|ESC|PUERTA|BIS|EDIF|EDIFICIO|TORRE|TORREO|CASA|ALTILLO)\b\s*[A-Z0-9\-º\.\,\/]*/gi, '');
  s = s.replace(/\s{2,}/g, ' ').replace(/,\s*,/g, ',').replace(/,\s*$/, '').trim();
  return s;
}
function makeQueries(s) {
  const full = (s.direccion_mymaps || (s.direccion + ', ' + s.cp + ' Barcelona, Spain')).trim();
  const cp = s.cp || '';
  // try to extract city from mymaps: "..., 08037 Barcelona, Spain"
  const cityMatch = full.match(/\b\d{4,5}\s+([^,]+?)(?:,|$)/);
  const city = cityMatch ? cityMatch[1].trim() : 'Barcelona';
  // build the simplified version: clean the street part before the postal code chunk
  const beforeCp = full.replace(/,\s*\d{4,5}\s+.*$/, ''); // drop ", 08037 Barcelona, Spain"
  const cleaned = cleanAddress(beforeCp);
  const cleanedFull = cleaned ? `${cleaned}, ${cp} ${city}, Spain` : '';
  const cpOnly = `${cp} ${city}, Spain`;
  // de-duplicate
  const tries = [];
  for (const q of [full, cleanedFull, cpOnly]) {
    if (q && !tries.includes(q)) tries.push(q);
  }
  return tries;
}
async function nominatimFetch(q) {
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(q), {
      headers: { 'Accept-Language': 'es' }
    });
    if (r.ok) {
      const j = await r.json();
      if (j && j.length) return { lat: parseFloat(j[0].lat), lng: parseFloat(j[0].lon) };
    }
  } catch (e) { /* network */ }
  return null;
}

async function geocodeAll(retryFailed = false) {
  if (state.geo.running) return;
  // pre-load geocache for fast pre-filter
  const cacheEntries = await dbAll(STORES.GEO);
  const cacheMap = new Map(cacheEntries.map(e => [e.key, e]));

  const allSedes = [];
  for (const g of state.groups) for (const s of g.sedes) allSedes.push(s);

  // pre-filter: apply cached results to memory, decide who actually needs fetching
  const todo = [];
  for (const s of allSedes) {
    if (s.lat && s.lng) continue;
    const key = (s.direccion_mymaps || s.direccion + ', ' + s.cp + ' Barcelona, Spain').trim();
    const cached = cacheMap.get(key);
    if (cached) {
      if (cached.lat && cached.lng) {
        s.lat = cached.lat; s.lng = cached.lng;
        // also persist to clients store so it survives reloads even without re-import
        const stored = await dbGet(STORES.CLIENTS, s.id_sede);
        if (stored && (!stored.lat || !stored.lng)) {
          stored.lat = cached.lat; stored.lng = cached.lng;
          await dbPut(STORES.CLIENTS, stored);
        }
      } else if (retryFailed) {
        todo.push(s); // user asked to retry the failed ones
      }
      continue;
    }
    todo.push(s);
  }

  if (state.view === 'map') { initMap(); updateMapOverlay(); }

  if (!todo.length) {
    const okCount = allSedes.filter(s => s.lat && s.lng).length;
    setProgress(`Mapa listo · ${okCount}/${allSedes.length} ubicaciones (${allSedes.length - okCount} sin coordenadas)`);
    if (state.view === 'map') updateMapOverlay();
    return;
  }

  state.geo.running = true;
  state.geo.total = todo.length; state.geo.done = 0;
  setProgress(`Geolocalizando 0/${todo.length}…`);
  if (state.view === 'map') updateMapOverlay();

  for (const s of todo) {
    const key = (s.direccion_mymaps || s.direccion + ', ' + s.cp + ' Barcelona, Spain').trim();
    let result = null;
    const tries = makeQueries(s);
    for (const q of tries) {
      result = await nominatimFetch(q);
      await new Promise(rs => setTimeout(rs, 1100)); // respect 1 req/sec
      if (result) break;
    }
    await dbPut(STORES.GEO, { key, lat: result ? result.lat : null, lng: result ? result.lng : null, ts: Date.now() });
    if (result) {
      s.lat = result.lat; s.lng = result.lng;
      const stored = await dbGet(STORES.CLIENTS, s.id_sede);
      if (stored) { stored.lat = result.lat; stored.lng = result.lng; await dbPut(STORES.CLIENTS, stored); }
    }
    state.geo.done++;
    setProgress(`Geolocalizando ${state.geo.done}/${state.geo.total}…`);
    if (state.view === 'map') {
      updateMapOverlay();
      if (state.geo.done % 5 === 0) initMap();
    }
  }
  state.geo.running = false;
  const okCount = allSedes.filter(s => s.lat && s.lng).length;
  setProgress(`Mapa listo · ${okCount}/${allSedes.length} ubicaciones (${allSedes.length - okCount} sin coordenadas)`);
  if (state.view === 'map') { initMap(); updateMapOverlay(); }
}

/* ---------- Import ---------- */
// Llegeix un CSV/XLSX de clients i el retorna com a llista de clients (o null si el format no és vàlid)
async function llegirFitxerClients(file) {
  setProgress('Leyendo archivo…');
  const ext = file.name.toLowerCase().split('.').pop();
  let rows = [];
  if (ext === 'csv') {
    const text = await file.text();
    rows = parseCSVText(text);
  } else if (ext === 'xlsx' || ext === 'xls') {
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: 'array', cellDates: false });
    const sh = wb.Sheets[wb.SheetNames[0]];
    rows = XLSX.utils.sheet_to_json(sh, { defval: '', raw: true });
    // normalize numeric date serials to DD/MM/YYYY (then mapRowToClient -> ISO)
    for (const r of rows) {
      for (const k of Object.keys(r)) {
        if (typeof r[k] === 'number' && /U\.?Venta|U_Visita|Visita|Venta/i.test(k) && r[k] > 30000 && r[k] < 60000) {
          r[k] = isoToDDMMYYYY(excelSerialToISO(r[k]));
        }
      }
    }
  } else { toast('Formato no soportado'); return null; }
  return rows.map(mapRowToClient).filter(Boolean);
}

async function importFile(file) {
  const allMapped = await llegirFitxerClients(file);
  if (!allMapped) return;
  // Separar BAJA: els traiem de la BD si ja existien, i no els reimportem
  const bajaIds = new Set(allMapped.filter(c => c.estado === 'BAJA').map(c => c.id_sede));
  const clients = allMapped.filter(c => c.estado !== 'BAJA');
  if (bajaIds.size > 0) {
    for (const id of bajaIds) await dbDelete(STORES.CLIENTS, id);
  }
  if (!clients.length) { toast('No se han encontrado filas válidas'); return; }

  // preserve existing lat/lng, importe_2026 i albarans_2026 si id_sede coincideix
  const existing = await dbAll(STORES.CLIENTS);
  const exMap = new Map(existing.map(e => [e.id_sede, e]));
  for (const c of clients) {
    const e = exMap.get(c.id_sede);
    if (e) {
      // Coordenades: el xlsx té prioritat si porta valors vàlids;
      // si no, preservar les de la BD (evita perdre geolocalitzacions fetes al CRM)
      if (!c.lat || !c.lng) {
        if (e.lat && e.lng) { c.lat = e.lat; c.lng = e.lng; }
      }
      // preservar dades del PDF si el xlsx no les porta (albarans_2026 mai ve del xlsx)
      if (!c.albarans_2026 && e.albarans_2026) c.albarans_2026 = e.albarans_2026;
      // preservar seguiment i idioma si el xlsx no els porta
      if (c.seguiment === false && e.seguiment) c.seguiment = e.seguiment;
      if (!c.no_contactar && e.no_contactar) c.no_contactar = true;
      if (!c.idioma && e.idioma) c.idioma = e.idioma;
      if (!c.seccions.length && e.seccions && e.seccions.length) c.seccions = e.seccions;
      // importe_2026: si el xlsx el porta (exportat des del CRM), ja ve a c; si no, preservar
      if ((!c.importe_2026) && e.importe_2026) c.importe_2026 = e.importe_2026;
    }
  }
  await dbClear(STORES.CLIENTS);
  await dbBulkPut(STORES.CLIENTS, clients);
  await dbPut(STORES.META, { k: 'lastImport', v: new Date().toISOString(), filename: file.name, count: clients.length });
  toast(`Importadas ${clients.length} filas`);
  await loadFromDB();
  applyFilters();
  if (state.view === 'list') renderList(); else renderMap();
}

/* ---------- Sincronitzar mòbil ↔ portàtil ---------- */
// Ajunta un fitxer exportat des de l'altre aparell amb les dades d'aquest, sense esborrar res:
// per a cada client es queda amb la versió modificada més recentment. Les dates d'última
// visita i última venda sempre es queden amb la més recent dels dos costats.
async function syncFile(file) {
  const fitxer = await llegirFitxerClients(file);
  if (!fitxer) return;
  if (!fitxer.length) { toast('No se han encontrado filas válidas'); return; }

  const locals = new Map((await dbAll(STORES.CLIENTS)).map(e => [e.id_sede, e]));
  const maxData = (a, b) => ((a || '') > (b || '') ? a : b) || '';
  const toPut = [];
  let nous = 0, actualitzats = 0;

  for (const c of fitxer) {
    const e = locals.get(c.id_sede);
    if (!e) {
      if (c.estado !== 'BAJA') { toPut.push(c); nous++; }
      continue;
    }
    if ((c.modificat || '') > (e.modificat || '')) {
      // Guanya el fitxer; conservar el que el fitxer no porta
      const m = { ...e, ...c };
      if (!c.lat || !c.lng) { m.lat = e.lat; m.lng = e.lng; }
      if (!c.albarans_2026) m.albarans_2026 = e.albarans_2026;
      m.u_visita = maxData(c.u_visita, e.u_visita);
      m.u_venta  = maxData(c.u_venta,  e.u_venta);
      toPut.push(m); actualitzats++;
    } else {
      // Guanya el local; només agafar dates de visita/venda més recents del fitxer
      const uv = maxData(c.u_visita, e.u_visita), uven = maxData(c.u_venta, e.u_venta);
      if (uv !== (e.u_visita || '') || uven !== (e.u_venta || '')) {
        e.u_visita = uv; e.u_venta = uven;
        toPut.push(e); actualitzats++;
      }
    }
  }

  if (toPut.length) await dbBulkPut(STORES.CLIENTS, toPut);
  await dbPut(STORES.META, { k: 'lastSync', v: new Date().toISOString(), filename: file.name, nous, actualitzats });
  toast(`🔄 Sincronitzat: ${actualitzats} actualitzats · ${nous} nous · cap esborrat`, 3500);
  await loadFromDB();
  applyFilters();
  if (state.view === 'list') renderList(); else if (state.view === 'map') renderMap();
  setProgress(`${state.groups.length} clientes cargados · sincronitzat ${new Date().toLocaleTimeString('ca-ES', {hour:'2-digit', minute:'2-digit'})}`);
}

/* ---------- Historical CSV import (estadistica_venta_2020_since_2025) ---------- */

function parseEuroNumber(s) {
  if (s === null || s === undefined) return 0;
  s = String(s).trim();
  if (!s) return 0;
  // Spanish format: thousands with periods, decimal with comma. e.g. "1.234,56" -> 1234.56
  return parseFloat(s.replace(/\./g, '').replace(',', '.')) || 0;
}

// Each row of the historical CSV has 25 fields with the pattern:
// [0..12] = repeated header tokens
// [13]    = importe del cliente (Euro string)
// [14]    = id cliente con prefijo cero (ej. "0024244")
// [15]    = nombre cliente
// [16]    = direccion
// [17]    = contacto
// [18]    = email
// [19]    = telefono
// [20]    = código postal
// [21..24] = footer (gran total, "Total Venta", fecha impresion, página)
function parseHistoricalRow(fields) {
  if (fields.length < 21) return null;
  const importe = parseEuroNumber(fields[13]);
  const idRaw = String(fields[14] || '').trim();
  if (!idRaw) return null;
  // strip leading zero(s): "0024244" -> "24244"; preserve if entirely numeric and short
  const id = idRaw.replace(/^0+/, '') || idRaw;
  return {
    id_empresa: id,
    importe,
    nombre: String(fields[15] || '').trim(),
    direccion: String(fields[16] || '').trim(),
    contacto: String(fields[17] || '').trim(),
    email: String(fields[18] || '').trim(),
    telefono: String(fields[19] || '').trim(),
    cp: String(fields[20] || '').trim().padStart(5, '0').slice(-5),
  };
}

async function importHistoricalFile(file) {
  setProgress('Leyendo CSV histórico…');
  const buf = await file.arrayBuffer();
  // Try UTF-8 first; if it has the replacement char, fallback to Windows-1252
  let text = new TextDecoder('utf-8').decode(buf);
  if (text.includes('�')) {
    text = new TextDecoder('windows-1252').decode(buf);
  }
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

  const lines = text.split(/\r?\n/).filter(l => l.length);
  if (!lines.length) { toast('CSV vacío'); return; }
  const delim = detectDelimiter(lines[0]);

  // Build map of historical rows keyed by id_empresa
  const histByEmpresa = new Map();
  for (const line of lines) {
    const fields = parseCSVLine(line, delim);
    const h = parseHistoricalRow(fields);
    if (h && h.id_empresa && h.nombre) {
      // sum if same empresa appears multiple times (shouldn't, but safe)
      const prev = histByEmpresa.get(h.id_empresa);
      if (prev) prev.importe += h.importe;
      else histByEmpresa.set(h.id_empresa, h);
    }
  }

  setProgress(`Procesando ${histByEmpresa.size} registros históricos…`);

  // Load current clients
  const existing = await dbAll(STORES.CLIENTS);
  const empresaIndex = new Map(); // id_empresa -> [sedes...]
  for (const s of existing) {
    const eid = String(s.id_empresa || (s.id_sede || '').split('_')[0]);
    if (!empresaIndex.has(eid)) empresaIndex.set(eid, []);
    empresaIndex.get(eid).push(s);
  }

  let updated = 0, added = 0;
  const toUpsert = [];

  for (const [eid, h] of histByEmpresa) {
    const sedes = empresaIndex.get(eid);
    if (sedes && sedes.length) {
      // Existing client: attach importe_historico to the FIRST sede only,
      // so card-level sum gives empresa total without double-counting.
      const first = sedes[0];
      first.importe_historico = h.importe;
      // do not change estado of existing actives
      toUpsert.push(first);
      // La resta de sedes a 0: si en tenen una còpia, l'empresa sortiria doblada
      for (const s of sedes.slice(1)) {
        if (s.importe_historico) { s.importe_historico = 0; toUpsert.push(s); }
      }
      updated++;
    } else {
      // Client no existeix al CRM → ignorar (pot ser una baixa o client eliminat)
      added++; // compta com "no trobat" per al missatge
    }
  }

  const araHist = new Date().toISOString();
  toUpsert.forEach(s => s.modificat = araHist);
  await dbBulkPut(STORES.CLIENTS, toUpsert);
  await dbPut(STORES.META, { k: 'lastHistImport', v: new Date().toISOString(), filename: file.name, added, updated });
  toast(`Històric importat: ${updated} clients actualitzats · ${added} no trobats al CRM (ignorats)`);
  setProgress(`${updated} clients actualitzats · ${added} no trobats al CRM`);
  await loadFromDB();
  applyFilters();
  if (state.view === 'list') renderList();
  if (state.view === 'map') initMap();
}

// Best-effort city from CP — covers the common Spanish prefixes seen in your data
function cityFromCP(cp) {
  if (!cp) return 'Spain';
  const p = cp.slice(0, 2);
  const map = { '08': 'Barcelona', '28': 'Madrid', '29': 'Málaga', '38': 'Tenerife', '07': 'Mallorca', '17': 'Girona', '01': 'Álava', '03': 'Alicante', '35': 'Las Palmas' };
  return map[p] || 'Spain';
}

/* ---------- Bulk clean dormidos: fills empty fields, optionally re-prioritizes ---------- */
function priorityFromImporte(v, thresholds) {
  // thresholds = { A: 1000, B: 200, C: 30 } (lower bounds)
  if (v >  thresholds.A) return 'A';
  if (v >= thresholds.B) return 'B';
  if (v >= thresholds.C) return 'C';
  return 'R';
}

async function cleanDormidos() {
  const all = await dbAll(STORES.CLIENTS);
  const dormidos = all.filter(s => (s.estado || '').toUpperCase() === 'DORMIDO');
  if (!dormidos.length) {
    toast('No hay clientes en estado DORMIDO');
    return;
  }

  // Detect which mode to run
  let needsFill = 0;
  for (const s of dormidos) {
    if (!s.u_visita || !s.frec || !s.prioridad || !s.alerta) needsFill++;
  }

  // Default thresholds (used when filling empty priority OR when re-prioritizing)
  const thresholds = { A: 1000, B: 200, C: 30 };

  let mode = '';
  if (needsFill > 0) {
    const ok = confirm(
      `¿Aplicar valores por defecto a ${needsFill} de ${dormidos.length} dormidos?\n\n` +
      `Solo se rellenan campos vacíos:\n` +
      `· U.Visita → 31/12/2025\n` +
      `· Frecuencia → 180 días\n` +
      `· Prioridad por venta histórica:\n` +
      `   A si > 1.000 €\n` +
      `   B si 200-1.000 €\n` +
      `   C si 30-200 €\n` +
      `   R si < 30 €\n` +
      `· Alerta → "? TOCA VISITA"\n\n` +
      `Los campos ya rellenos NO se sobreescriben.`
    );
    if (!ok) return;
    mode = 'fill';
  } else {
    // All filled — offer to re-prioritize
    const ok = confirm(
      `Los ${dormidos.length} dormidos ya tienen valores por defecto.\n\n` +
      `¿Recalcular SOLO la prioridad con los umbrales nuevos?\n\n` +
      `· A si > 1.000 €\n` +
      `· B si 200-1.000 €\n` +
      `· C si 30-200 €\n` +
      `· R si < 30 €\n\n` +
      `Esto sobreescribe la prioridad existente de los dormidos.\n` +
      `El resto de campos (U.Visita, frecuencia, alerta) NO se tocan.`
    );
    if (!ok) return;
    mode = 'reprio';
  }

  setProgress(mode === 'fill' ? `Limpiando ${needsFill} dormidos…` : `Re-priorizando ${dormidos.length} dormidos…`);
  let changed = 0;
  const toUpsert = [];
  for (const s of dormidos) {
    let modified = false;
    if (mode === 'fill') {
      if (!s.u_visita) { s.u_visita = '2025-12-31'; modified = true; }
      if (!s.frec)     { s.frec = 180; modified = true; }
      if (!s.alerta)   { s.alerta = '? TOCA VISITA'; modified = true; }
      if (!s.prioridad) {
        s.prioridad = priorityFromImporte(s.importe_historico || 0, thresholds);
        modified = true;
      }
    } else {
      // re-prioritize regardless of existing value
      const newPrio = priorityFromImporte(s.importe_historico || 0, thresholds);
      if (s.prioridad !== newPrio) {
        s.prioridad = newPrio;
        modified = true;
      }
    }
    if (modified) { toUpsert.push(s); changed++; }
  }
  const araDorm = new Date().toISOString();
  toUpsert.forEach(s => s.modificat = araDorm);
  if (toUpsert.length) await dbBulkPut(STORES.CLIENTS, toUpsert);
  toast(`${changed} dormidos ${mode === 'fill' ? 'limpiados' : 're-priorizados'}`);
  setProgress(`${changed} dormidos actualizados`);
  await loadFromDB();
  applyFilters();
  if (state.view === 'list') renderList();
  if (state.view === 'map') initMap();
}

/* ---------- PDF "Histórico clientes detallado" import ----------
   Parseja el PDF de l'ERP (PMC).
   - importe_2026:  SOBREESCRIU cada vegada (PDF acumulat 01/01-XX/XX)
   - albarans_2026: llista [{num, data}] sobreescrita cada vegada
   - u_venta:       actualitza si la data és més recent
   - DORMIDO + venda → ACTIVO + prioritat B
   ------------------------------------------------------------ */
async function importPDFVendes(file) {
  setProgress('Llegint PDF…');
  toast('Processant PDF, pot trigar uns segons…', 4000);

  const buf = await file.arrayBuffer();

  if (!window.pdfjsLib) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const pdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;

  // Recollir tots els items de tot el document amb posició Y absoluta
  // (pàgina*10000 + y per tenir un Y global únic per pàgina)
  const allItems = []; // {x, y (global), t}

  for (let p = 1; p <= pdfDoc.numPages; p++) {
    const page = await pdfDoc.getPage(p);
    const tc   = await page.getTextContent();
    const pageOffset = p * 10000;
    for (const item of tc.items) {
      if (!item.str.trim()) continue;
      // En PDF les coordenades Y van de baix a dalt → invertir per tenir top-down
      const y = pageOffset - item.transform[5];
      allItems.push({ x: item.transform[4], y, t: item.str.trim() });
    }
  }

  // Agrupar per Y (tolerància 1px arrodonint)
  const byY = new Map();
  for (const it of allItems) {
    const yk = Math.round(it.y);
    if (!byY.has(yk)) byY.set(yk, []);
    byY.get(yk).push(it);
  }

  // Construir línies ordenades
  const lines = [];
  for (const [yk, items] of [...byY.entries()].sort((a,b) => a[0]-b[0])) {
    items.sort((a,b) => a.x - b.x);
    lines.push({ y: yk, text: items.map(i=>i.t).join(' '), items });
  }

  // Regex
  const reParcial  = /Parcial\s+del\s+cliente\s+(\d+)\s+[\d.,]+\s+([\d.,]+)/;
  const reAlbaran  = /^(\d+\.\d{3})$/;
  const reDateWord = /^(\d{2})\/(\d{2})\/(\d{4})$/;

  // Parsejar bloc a bloc
  const clienteMap = new Map(); // id -> {importe_2026, albarans, lastDate}
  let blockStart = 0;

  for (let i = 0; i < lines.length; i++) {
    const mp = reParcial.exec(lines[i].text);
    if (!mp) continue;

    const idRaw     = mp[1];
    const idEmpresa = idRaw.replace(/^0+/, '') || idRaw;
    const importeStr = mp[2].replace(/\./g,'').replace(',','.');
    const importe   = parseFloat(importeStr) || 0;

    const bloc = lines.slice(blockStart, i);
    blockStart = i + 1;

    // Extreure albarans amb la seva data corresponent.
    // Estratègia: recollir tots els items del bloc amb posició (x,y),
    // i per cada número d'albarà trobar la data amb menor distància euclidiana.
    const albItems  = []; // {num, x, y}
    const dateItems = []; // {date, x, y}

    for (const bl of bloc) {
      for (const it of bl.items) {
        if (reAlbaran.test(it.t)) {
          // Evitar duplicats: guardar totes les ocurrències (mateixa factura pot repetir-se)
          albItems.push({ num: it.t, x: it.x, y: bl.y });
        }
        const md = reDateWord.exec(it.t);
        if (md) {
          dateItems.push({ date: it.t, x: it.x, y: bl.y });
        }
      }
    }

    // Per cada albarà únic, trobar la data més propera (distància euclidiana x,y)
    const albSet = new Map(); // num -> data
    const seen   = new Set();
    for (const alb of albItems) {
      if (seen.has(alb.num)) continue;
      seen.add(alb.num);
      let bestDate = null;
      let bestDist = Infinity;
      for (const d of dateItems) {
        const dx = alb.x - d.x;
        const dy = alb.y - d.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < bestDist) {
          bestDist = dist;
          bestDate = d.date;
        }
      }
      albSet.set(alb.num, bestDate);
    }

    const albarans = [...albSet.entries()]
      .map(([num, data]) => ({ num, data: data || '' }))
      .sort((a, b) => {
        // Ordenar per data (convertir dd/mm/yyyy → yyyy-mm-dd per comparar)
        const toISO = d => d ? d.split('/').reverse().join('-') : '';
        return toISO(a.data).localeCompare(toISO(b.data));
      });

    const lastDateDisplay = albarans.reduce((best, a) => {
      if (!a.data) return best;
      const toISO = d => d.split('/').reverse().join('-');
      return (!best || toISO(a.data) > toISO(best)) ? a.data : best;
    }, null);

    const lastDateISO = lastDateDisplay
      ? lastDateDisplay.split('/').reverse().join('-') : null;

    // Acumular si apareix més d'un bloc per mateixa empresa (multi-sede al PDF)
    const prev = clienteMap.get(idEmpresa);
    if (prev) {
      prev.importe_2026 += importe;
      const existNums = new Set(prev.albarans.map(a => a.num));
      for (const a of albarans) if (!existNums.has(a.num)) prev.albarans.push(a);
      if (lastDateISO && (!prev.lastDate || lastDateISO > prev.lastDate))
        prev.lastDate = lastDateISO;
    } else {
      clienteMap.set(idEmpresa, { importe_2026: importe, albarans, lastDate: lastDateISO });
    }
  }

  if (clienteMap.size === 0) {
    toast('⚠ No s\'han trobat clients al PDF. Comprova el format.', 3500);
    setProgress(''); return;
  }

  // Actualitzar clients al CRM
  const existing    = await dbAll(STORES.CLIENTS);
  const empresaIdx  = new Map();
  for (const s of existing) {
    const eid = s.id_empresa || (s.id_sede||'').split('_')[0];
    if (!empresaIdx.has(eid)) empresaIdx.set(eid, []);
    empresaIdx.get(eid).push(s);
  }

  let updated = 0, notFound = 0, reactivated = 0;
  const toUpsert = [];

  for (const [eid, data] of clienteMap) {
    if (data.importe_2026 <= 0) continue;
    const sedes = empresaIdx.get(eid);
    if (!sedes || !sedes.length) { notFound++; continue; }

    // Actualitzar TOTES les sedes de l'empresa
    for (const sede of sedes) {
      const s = { ...sede };

      // SOBREESCRIURE importe_2026 i albarans a la primera sede (agrupació per empresa)
      if (s.id_sede === sedes[0].id_sede) {
        s.importe_2026  = data.importe_2026;
        s.albarans_2026 = data.albarans;
      }

      // Actualitzar u_venta a TOTES les sedes si la data del PDF és més recent
      if (data.lastDate) {
        const cur = s.u_venta || '';
        if (!cur || data.lastDate > cur) s.u_venta = data.lastDate;
      }

      // DORMIDO + venda → ACTIVO + prioritat B
      if ((s.estado || 'ACTIVO').toUpperCase() === 'DORMIDO') {
        s.estado    = 'ACTIVO';
        s.prioridad = 'B';
        if (s.id_sede === sedes[0].id_sede) reactivated++;
      }

      toUpsert.push(s);
    }
    updated++;
  }

  const araPDF = new Date().toISOString();
  toUpsert.forEach(s => s.modificat = araPDF);
  await dbBulkPut(STORES.CLIENTS, toUpsert);

  const allSedes = await dbAll(STORES.CLIENTS);
  state.groups   = groupByEmpresa(migrarPrioritats(allSedes));
  applyFilters();
  if (state.view === 'list') renderList();
  if (state.view === 'map')  renderMap();

  const msg = `PDF importat ✅  ${updated} clients actualitzats · ${reactivated} DORMIT→ACTIU · ${notFound} no trobats`;
  toast(msg, 5000);
  setProgress(msg);
}

  if (!state.filtered.length) { toast('No hi ha cap client a la llista'); return; }

                 'Idioma','Seccions que compra','Prioritat','Estat','Adreça','CP','Última venda','Última visita']];

  for (const g of state.filtered) {

/* ---------- Filtering ---------- */
function applyFilters() {
  const q = state.filters.q.toLowerCase();
  const prios = state.filters.prios;
  const estados = state.filters.estados;
  const onlyAlerta = state.filters.alerta;
  const onlyPte = state.filters.verif_pte;
  state.filtered = state.groups.filter(g => {
    if (estados.size) {
      const has = g.sedes.some(s => estados.has(s.estado || 'ACTIVO'));
      if (!has) return false;
    }
    if (prios.size) {
      const has = g.sedes.some(s => prios.has(s.prioridad));
      if (!has) return false;
    }
    if (onlyAlerta) {
      const has = g.sedes.some(s => (s.alerta||'').includes('TOCA'));
      if (!has) return false;
    }
    if (onlyPte) {
      const has = g.sedes.some(s => s.verificado === 'PTE');
      if (!has) return false;
    }
    if (state.filters.only_no_contactar && !esNoContactar(g)) return false;
    if (state.filters.only_seguiment) {
      const has = g.sedes.some(s => s.seguiment === true);
      if (!has) return false;
    }
    if (state.filters.only_corona) {
      const has = g.sedes.some(s => (s.importe_2026 || 0) > 0);
      if (!has) return false;
    }
    if (state.filters.only_alerta_hist) {
      const hasHist  = g.sedes.some(s => (s.importe_historico || 0) > 0);
      const has2026  = g.sedes.some(s => (s.importe_2026 || 0) > 0);
      const isActivo = g.sedes.some(s => (s.estado || 'ACTIVO') === 'ACTIVO');
      if (!hasHist || has2026 || !isActivo) return false;
    }
    // Clients que fa més de N dies que no compren (només els que havien comprat alguna vegada)
    if (state.filters.senseComprar) {
      const d = diesSenseComprar(g);
      if (d === null || d < state.filters.diesSenseComprar) return false;
    }
    // Seccions de producte: unió de les seccions de totes les sedes de l'empresa
    const { seccio, seccioMode } = state.filters;
    if (seccioMode === 'sense' || seccio) {
      const sec = new Set(g.sedes.flatMap(s => s.seccions || []));
      if (seccioMode === 'sense') { if (sec.size) return false; }
      else if (seccioMode === 'compra') { if (!sec.has(seccio)) return false; }
      else if (seccioMode === 'no') { if (!sec.size || sec.has(seccio)) return false; }
    }
    if (state.filters.cp) {
      const cpQ = state.filters.cp.trim();
      const has = g.sedes.some(s => (s.cp || '').startsWith(cpQ));
      if (!has) return false;
    }
    if (q) {
      const blob = (g.nombre_padre + ' ' + g.sedes.map(s =>
        [s.nombre, s.direccion, s.contacto_1, s.contacto_2, s.email_1, s.email_2, s.telefono, s.movil, s.cp].join(' ')
      ).join(' ')).toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
  // Sense comprar: primer els que fa menys temps que han deixat de comprar (més fàcils de recuperar)
  if (state.filters.senseComprar) state.filtered.sort((a, b) => diesSenseComprar(a) - diesSenseComprar(b));
  document.getElementById('countPill').textContent =
    `${state.filtered.length} / ${state.groups.length} clientes`;
  // update estado chip counters
  const counts = { ACTIVO: 0, DORMIDO: 0, LEAD: 0, BAJA: 0 };
  for (const g of state.groups) {
    const e = (g.sedes[0]?.estado || 'ACTIVO').toUpperCase();
    if (counts[e] !== undefined) counts[e]++;
  }
  document.querySelectorAll('#estadoRow .chip.estado').forEach(ch => {
    const e = ch.dataset.estado;
    const baseLabel = ({ACTIVO:'Activos', DORMIDO:'💤 Dormidos', LEAD:'🎯 Leads', BAJA:'Baja'})[e] || e;
    ch.textContent = `${baseLabel} (${counts[e] || 0})`;
  });
}

  document.getElementById('btnNouClient').onclick = () => {
    // Reset formulari
    ['nc_id','nc_nom','nc_dir','nc_cp','nc_mymaps','nc_c1','nc_e1',
     'nc_tel','nc_mov','nc_obs','nc_prox'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('nc_prio').value = 'B';
    document.getElementById('nc_estat').value = 'ACTIVO';
    document.getElementById('nc_frec').value = '60';
    document.getElementById('nc_error').style.display = 'none';
    document.getElementById('modalNouClient').classList.remove('hide');
  };
  document.getElementById('nc_cancel').onclick = () => {
    document.getElementById('modalNouClient').classList.add('hide');
  };
  document.getElementById('modalNouClient').addEventListener('click', (e) => {
    if (e.target === document.getElementById('modalNouClient'))
      document.getElementById('modalNouClient').classList.add('hide');
  });
  document.getElementById('nc_save').onclick = saveNouClient;
}

/* ---------- Sandbox detection (warn if loaded inside an iframe) ---------- */
function checkSandbox() {
  let isFramed = false;
  try { isFramed = (window.self !== window.top); } catch (e) { isFramed = true; }
  if (!isFramed) return;
  // Probe IndexedDB to see if storage is sandboxed (origin = "null")
  const banner = document.createElement('div');
  banner.style.cssText = 'background:#fde0de;color:#a52821;padding:10px 14px;font-size:13px;border-bottom:1px solid var(--pr);text-align:center;line-height:1.5;';
  banner.innerHTML = `<b>⚠ Esta página está cargada dentro de un visor (probablemente OneDrive web).</b><br>
    El botón Importar y la persistencia de datos pueden no funcionar.<br>
    Solución: descarga este archivo a tu dispositivo y ábrelo desde el explorador, o pulsa "Abrir en navegador" desde la app de OneDrive.`;
  document.querySelector('.app').prepend(banner);
}
checkSandbox();

function switchView(v) {
  state.view = v;
  document.getElementById('tabList').classList.toggle('active', v === 'list');
  document.getElementById('tabMap').classList.toggle('active', v === 'map');
  document.getElementById('tabRutes').classList.toggle('active', v === 'rutes');
  if (v === 'rutes') {
    document.getElementById('filterBar').classList.add('hide');
  } else {
    document.getElementById('filterBar').classList.remove('hide');
  }
  if (v === 'list') renderList();
  else if (v === 'map') {
    renderMap();
    geocodeAll();
  }
  else if (v === 'rutes') renderRutes();
}

/* ---------- Boot ---------- */
(async function boot() {
  wire();
  await loadFromDB();
  applyFilters();
  renderList();
  setProgress(state.groups.length ? `${state.groups.length} clientes cargados` : 'Sin datos: pulsa 📥 Importar');
})();
</script>
